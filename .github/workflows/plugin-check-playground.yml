# Run WP.org's Plugin Check against the built, distributable plugin using
# WordPress Playground — mirroring the command we run locally.
name: Plugin Check (Playground)

on:
  pull_request:
    branches:
      - trunk

# Allow the workflow to leave/update a comment on the pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Generate the distributable zip
        env:
          # dist-archive-command is a public package; clear any token so
          # WP-CLI's bundled Composer doesn't reject it during validation.
          GITHUB_TOKEN: ''
          COMPOSER_AUTH: ''
        run: |
          wp package install wp-cli/dist-archive-command:3.1.0
          wp dist-archive . /tmp/toggle-block.zip

      - name: Extract the zip to a fresh directory
        run: |
          rm -rf /tmp/toggle-block
          mkdir -p /tmp/toggle-block
          unzip -q /tmp/toggle-block.zip -d /tmp/toggle-block

      - name: Add the Playground blueprint to the extracted plugin
        run: |
          plugin_dir="$(find /tmp/toggle-block -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo "PLUGIN_DIR=${plugin_dir}" >> "$GITHUB_ENV"
          cat > "${plugin_dir}/blueprint.json" <<'JSON'
          {
            "steps": [
              {"step": "installPlugin", "pluginData": {"resource": "wordpress.org/plugins", "slug": "plugin-check"}},
              {"step": "wp-cli", "command": "wp plugin activate plugin-check toggle-block"},
              {"step": "cp",
                "fromPath": "/wordpress/wp-content/plugins/plugin-check/drop-ins/object-cache.copy.php",
                "toPath": "/wordpress/wp-content/object-cache.php"}
            ]
          }
          JSON

      - name: Run Plugin Check via WordPress Playground
        run: |
          cd "$PLUGIN_DIR"
          npx --yes @wp-playground/cli php \
            --blueprint=blueprint.json \
            --mount=./:/wordpress/wp-content/plugins/toggle-block \
            --quiet \
            -- /tmp/wp-cli.phar plugin check toggle-block \
              --categories=plugin_repo \
              --format=json \
              --error-severity=7 \
              --warning-severity=6 \
              --include-low-severity-errors \
            > /tmp/plugin-check-result.json || true
          echo "Plugin Check raw output:"
          cat /tmp/plugin-check-result.json

      - name: Report results on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- plugin-check-playground -->';

            let raw = '';
            try {
              raw = fs.readFileSync('/tmp/plugin-check-result.json', 'utf8').trim();
            } catch (e) {}

            // The Playground/WP-CLI output should be a JSON array; slice from
            // the first '[' to the last ']' in case of stray leading output.
            let issues = [];
            const start = raw.indexOf('[');
            const end = raw.lastIndexOf(']');
            if (start !== -1 && end !== -1) {
              try {
                issues = JSON.parse(raw.slice(start, end + 1));
              } catch (e) {
                core.warning(`Could not parse Plugin Check output: ${e.message}`);
              }
            }

            const errors = issues.filter(
              (i) => String(i.type).toUpperCase() === 'ERROR'
            );
            const warnings = issues.filter(
              (i) => String(i.type).toUpperCase() === 'WARNING'
            );

            let body;
            if (issues.length === 0) {
              body =
                `${marker}\n### ✅ Plugin Check passed\n\n` +
                'No errors or warnings from `plugin check --categories=plugin_repo`.';
            } else {
              const esc = (s) => String(s ?? '').replace(/\|/g, '\\|');
              const rows = issues
                .map(
                  (i) =>
                    `| ${esc(i.file)} | ${esc(i.line)}:${esc(i.column)} | ${esc(i.type)} | \`${esc(i.code)}\` | ${esc(i.message)} |`
                )
                .join('\n');
              body =
                `${marker}\n### Plugin Check: ${errors.length} error(s), ${warnings.length} warning(s)\n\n` +
                '| File | Line:Col | Type | Code | Message |\n' +
                '| --- | --- | --- | --- | --- |\n' +
                rows;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (issue_number) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number }
              );
              const existing = comments.find(
                (c) => c.body && c.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            }

            if (errors.length > 0) {
              core.setFailed(`Plugin Check reported ${errors.length} error(s).`);
            }
